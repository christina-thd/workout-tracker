<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App logo: a pulse line across, ending in a bright dot: a heartbeat, for any sport or workout.
       Also the source of icon.png and the home-screen icons (art/render.sh). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2a22"/>
      <stop offset="1" stop-color="#0e1511"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c6b45" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#4fa874"/>
      <stop offset="1" stop-color="#c4e6cf"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7fc298" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fc298" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- the beat: flat, a small rise, the spike up and down, and flat again -->
  <path d="M72 280 H160 L188 236 L216 280 L250 120 L296 392 L330 256 L352 280 H400" fill="none" stroke="url(#pulse)"
    stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- where it is now -->
  <circle cx="420" cy="280" r="58" fill="url(#glow)"/>
  <circle cx="420" cy="280" r="24" fill="#ffffff"/>
</svg>
