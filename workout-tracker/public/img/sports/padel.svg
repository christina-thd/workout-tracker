<svg xmlns="http://www.w3.org/2000/svg" viewBox="1.5 1.5 33.5 33.5">
  <!-- Padel racket and ball, flat like the Twemoji set the rest of the app uses (Unicode has no padel emoji). -->
  <g transform="rotate(40 18 18)">
    <!-- handle and grip -->
    <rect x="15.7" y="23" width="4.6" height="11.5" rx="2" fill="#31373D"/>
    <rect x="15.7" y="28" width="4.6" height="6.5" rx="2" fill="#66757F"/>
    <!-- throat -->
    <path d="M13.2 20.8 18 25.6l4.8-4.8" fill="none" stroke="#31373D" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- solid face with its rim -->
    <path d="M18 1c7 0 10.6 4.6 10.6 11 0 6.8-4.8 12.2-10.6 12.2S7.4 18.8 7.4 12C7.4 5.6 11 1 18 1z"
      fill="#3B88C3" stroke="#1C5F96" stroke-width="1.6"/>
    <!-- holes -->
    <g fill="#E1E8ED">
      <circle cx="14.8" cy="6.6" r="1.1"/><circle cx="18" cy="5.8" r="1.1"/><circle cx="21.2" cy="6.6" r="1.1"/>
      <circle cx="12.8" cy="10.3" r="1.1"/><circle cx="16.2" cy="9.9" r="1.1"/><circle cx="19.8" cy="9.9" r="1.1"/><circle cx="23.2" cy="10.3" r="1.1"/>
      <circle cx="14.2" cy="14" r="1.1"/><circle cx="18" cy="13.8" r="1.1"/><circle cx="21.8" cy="14" r="1.1"/>
      <circle cx="16" cy="17.6" r="1.1"/><circle cx="20" cy="17.6" r="1.1"/>
    </g>
  </g>
  <!-- ball -->
  <circle cx="29.5" cy="29.5" r="5" fill="#CDD45B"/>
  <path d="M25.5 26.7c2.4 1 3.6 3.4 2.9 6.2M33.5 32.3c-2.4-1-3.6-3.4-2.9-6.2" fill="none" stroke="#FFFFFF" stroke-width="1.1"
    stroke-linecap="round"/>
</svg>
