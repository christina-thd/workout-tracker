<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36">
  <!-- A tennis ball, flat like the rest of the set: a muted optic yellow, with the seam as two arcs curving round
       opposite corners (circles clipped to the ball, so they meet its edge cleanly). -->
  <defs>
    <clipPath id="ball"><circle cx="18" cy="18" r="16"/></clipPath>
  </defs>
  <circle cx="18" cy="18" r="16" fill="#CDD45B"/>
  <g clip-path="url(#ball)" fill="none" stroke="#F4F4EC" stroke-width="2.2">
    <circle cx="-6" cy="-6" r="28.5"/>
    <circle cx="42" cy="42" r="28.5"/>
  </g>
</svg>
