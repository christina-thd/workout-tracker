name: "Workout Tracker"
description: "Log your padel sessions and workouts, with charts of how you're doing"
version: "1.0.0"
slug: "workout_tracker"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
startup: application
boot: auto
ingress: true
ingress_port: 3400
# Optional direct address (http://<homeassistant-ip>:3400/), e.g. for "Add to Home Screen" on a phone
# or a browser tab on a PC. Not needed for the Home Assistant sidebar or app.
ports:
  3400/tcp: 3400
  3401/tcp: 3401
ports_description:
  3400/tcp: "Web interface (not needed for the Home Assistant sidebar)"
  3401/tcp: "Secure web interface, with the ssl option (to install it as an app on Android)"
# Read-only access to the "ssl" folder, for Home Assistant's own certificate (see DOCS.md)
map:
  - ssl:ro
panel_icon: "mdi:tennis"
panel_title: "Workouts"
options:
  currency: EUR
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  currency: "match(^[A-Z]{3}$)"
  ssl: bool
  certfile: str
  keyfile: str
